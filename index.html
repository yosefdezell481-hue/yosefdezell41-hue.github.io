<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الفضاء</title>
<style>
  body { margin:0; background:#000; overflow:hidden; color:#fff; font-family:'Cairo',sans-serif; }
  canvas { display:block; position:absolute; top:0; left:0; }
  .models { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; gap:20px; flex-wrap:wrap; justify-content:center; z-index:2; }
  .model-box { width:300px; height:400px; background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; }
  h1 { position:absolute; top:10%; width:100%; text-align:center; font-size:40px; color:#00eaff; text-shadow:0 0 20px #00eaff; z-index:2; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <h1>موقع الفضاء</h1>
  <canvas id="bg"></canvas>
  <div class="models">
    <canvas class="model-box" id="model1"></canvas>
    <canvas class="model-box" id="model2"></canvas>
    <canvas class="model-box" id="model3"></canvas>
    <canvas class="model-box" id="model4"></canvas>
  </div>

<script type="module">
import * as THREE from 'three';

// الخلفية
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('bg')});
renderer.setSize(window.innerWidth, window.innerHeight);
const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array.from({length:3000},()=> (Math.random()-0.5)*2000),3)), new THREE.PointsMaterial({color:0xffffff}));
scene.add(stars);
camera.position.z=500;
function animateBg(){ requestAnimationFrame(animateBg); stars.rotation.y+=0.0005; renderer.render(scene,camera); }
animateBg();

// الموديلات - مكعبات بتلف مكان الايفون
function makeBox(id){
  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(45, 300/400, 0.1, 1000);
  const r = new THREE.WebGLRenderer({canvas:document.getElementById(id), alpha:true});
  r.setSize(300,400);
  s.add(new THREE.DirectionalLight(0xffffff,2));
  const geo = new THREE.BoxGeometry(1.5,3,0.2);
  const mat = new THREE.MeshStandardMaterial({color:0x00eaff, metalness:0.7, roughness:0.2});
  const mesh = new THREE.Mesh(geo, mat);
  s.add(mesh);
  c.position.z=5;
  function anim(){ requestAnimationFrame(anim); mesh.rotation.y+=0.01; r.render(s,c); }
  anim();
}
makeBox('model1'); makeBox('model2'); makeBox('model3'); makeBox('model4');
</script>
</body>
</html>
